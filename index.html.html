<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>我的理财本</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0ede8;--surface3:#e8e5e0;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);
  --text:#1a1a18;--text2:#6b6a65;--text3:#a8a7a2;
  --income:#0F6E56;--income-bg:#E1F5EE;
  --expense:#993C1D;--expense-bg:#FAECE7;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --purple:#534AB7;--purple-bg:#EEEDFE;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --r:10px;--rl:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18;--surface:#242422;--surface2:#2e2e2b;--surface3:#383835;
    --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
    --text:#f0ede8;--text2:#9e9d98;--text3:#5a5955;
    --income:#5DCAA5;--income-bg:#0a3328;
    --expense:#F0997B;--expense-bg:#3d1a0e;
    --blue:#85B7EB;--blue-bg:#042C53;
    --purple:#AFA9EC;--purple-bg:#26215C;
    --amber:#EF9F27;--amber-bg:#412402;
  }
}
body{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 16px}
.nav-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:10px 0}
.nav h1{font-size:16px;font-weight:600;margin-right:auto}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border:none;background:none;cursor:pointer;color:var(--text2);border-radius:var(--r);transition:all .15s;font-family:inherit;font-size:10px;min-width:52px}
.nav-btn i{font-size:20px}
.nav-btn.active{color:var(--text);background:var(--surface2)}

/* LAYOUT */
.container{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.page{display:none}.page.active{display:block}

/* CARDS */
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:14px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}

/* METRICS */
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.metric{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px 16px}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:5px}
.metric-value{font-size:19px;font-weight:600}

/* FORMS */
.type-toggle{display:flex;border:0.5px solid var(--border2);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.type-btn{flex:1;padding:9px;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--text2);transition:background .15s,color .15s;font-family:inherit}
.type-btn.income.active{background:var(--income-bg);color:var(--income)}
.type-btn.expense.active{background:var(--expense-bg);color:var(--expense)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
input,select,textarea{width:100%;padding:9px 12px;font-size:14px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--text2)}
textarea{resize:vertical;min-height:60px}
.btn-primary{width:100%;padding:10px;font-size:14px;font-weight:600;border:none;border-radius:var(--r);background:var(--text);color:var(--bg);cursor:pointer;transition:opacity .15s;font-family:inherit;margin-top:4px}
.btn-primary:hover{opacity:.82}
.btn-sm{padding:5px 12px;font-size:12px;border:0.5px solid var(--border2);border-radius:99px;background:transparent;cursor:pointer;color:var(--text2);font-family:inherit;transition:all .15s}
.btn-sm:hover{background:var(--surface2)}
.btn-sm.danger:hover{color:var(--expense);border-color:var(--expense)}

/* FILTER */
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;font-size:12px;border:0.5px solid var(--border2);border-radius:99px;background:transparent;cursor:pointer;color:var(--text2);transition:all .15s;font-family:inherit}
.filter-btn.active{background:var(--text);color:var(--bg);border-color:transparent}

/* RECORDS */
.records{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.record{display:flex;align-items:center;gap:12px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:11px 14px}
.record-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-income{background:#1D9E75}.dot-expense{background:#D85A30}
.record-info{flex:1;min-width:0}
.record-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record-meta{font-size:11px;color:var(--text2);margin-top:2px}
.record-amount{font-size:15px;font-weight:600;flex-shrink:0}
.amount-income{color:var(--income)}.amount-expense{color:var(--expense)}
.record-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:2px 4px;opacity:.6;transition:opacity .15s;line-height:1}
.record-del:hover{opacity:1;color:var(--expense)}

/* BAR CHART */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--text2);min-width:52px;text-align:right}
.bar-track{flex:1;background:var(--surface2);border-radius:4px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.bar-amount{font-size:12px;color:var(--text2);min-width:58px}

/* BUDGET */
.budget-item{border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.budget-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.budget-cat{font-size:14px;font-weight:500}
.budget-amounts{font-size:12px;color:var(--text2)}
.budget-bar-track{background:var(--surface2);border-radius:4px;height:8px;overflow:hidden;margin-bottom:4px}
.budget-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.budget-status{font-size:11px;color:var(--text2)}

/* SAVINGS */
.tip-item{border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;background:var(--surface);display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:background .15s}
.tip-item:hover{background:var(--surface2)}
.tip-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tip-item.done .tip-check{background:var(--income);border-color:var(--income);color:#fff}
.tip-item.done .tip-text{text-decoration:line-through;color:var(--text2)}
.tip-body{flex:1;min-width:0}
.tip-text{font-size:14px;font-weight:500;margin-bottom:2px}
.tip-sub{font-size:12px;color:var(--text2)}
.tip-save{font-size:12px;color:var(--income);font-weight:500;margin-top:4px}

/* WISHLIST */
.wish-item{border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;background:var(--surface)}
.wish-header{display:flex;align-items:flex-start;gap:10px}
.wish-info{flex:1;min-width:0}
.wish-name{font-size:14px;font-weight:500;margin-bottom:3px}
.wish-meta{font-size:12px;color:var(--text2)}
.wish-price{font-size:16px;font-weight:600;color:var(--purple);flex-shrink:0}
.wish-progress-wrap{margin-top:10px}
.wish-progress-track{background:var(--surface2);border-radius:4px;height:6px;overflow:hidden;margin-bottom:4px}
.wish-progress-fill{height:100%;border-radius:4px;background:var(--purple);transition:width .4s ease}
.wish-progress-label{font-size:11px;color:var(--text2);display:flex;justify-content:space-between}
.wish-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-green{background:var(--income-bg);color:var(--income)}

/* EMPTY */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text2);font-size:14px}
.empty i{font-size:36px;opacity:.3;display:block;margin-bottom:10px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:all .3s ease;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--rl);padding:20px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-row{margin-bottom:12px}
.modal-row label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions button{flex:1}
.btn-cancel{padding:10px;font-size:14px;border:0.5px solid var(--border2);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--text2);font-family:inherit}

@media(max-width:480px){
  .metric-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .metric-value{font-size:15px}
  .form-row-3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <h1>💰 理财本</h1>
    <button class="nav-btn active" onclick="goPage('ledger',this)"><i class="ti ti-book"></i>记账</button>
    <button class="nav-btn" onclick="goPage('budget',this)"><i class="ti ti-chart-pie"></i>预算</button>
    <button class="nav-btn" onclick="goPage('savings',this)"><i class="ti ti-coin"></i>省钱</button>
    <button class="nav-btn" onclick="goPage('wishlist',this)"><i class="ti ti-star"></i>心愿</button>
  </div>
</nav>

<div class="container">

<!-- ===== PAGE: 记账 ===== -->
<div id="page-ledger" class="page active">
  <div class="metric-grid">
    <div class="metric"><div class="metric-label">总收入</div><div class="metric-value" style="color:var(--income)" id="m-income">¥0</div></div>
    <div class="metric"><div class="metric-label">总支出</div><div class="metric-value" style="color:var(--expense)" id="m-expense">¥0</div></div>
    <div class="metric"><div class="metric-label">结余</div><div class="metric-value" id="m-balance">¥0</div></div>
  </div>

  <div class="card">
    <div class="type-toggle">
      <button class="type-btn income active" id="btn-income" onclick="setType('income')">＋ 收入</button>
      <button class="type-btn expense" id="btn-expense" onclick="setType('expense')">－ 支出</button>
    </div>
    <div class="form-row">
      <input type="text" id="inp-name" placeholder="备注（如：工资、餐饮）"/>
      <input type="number" id="inp-amount" placeholder="金额（元）" min="0" step="0.01"/>
    </div>
    <div class="form-row">
      <select id="inp-cat"></select>
      <input type="date" id="inp-date"/>
    </div>
    <button class="btn-primary" onclick="addRecord()">添加记录</button>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
    <button class="filter-btn" onclick="setFilter('income',this)">收入</button>
    <button class="filter-btn" onclick="setFilter('expense',this)">支出</button>
  </div>

  <div class="records" id="records-list"></div>

  <div class="card">
    <div class="card-title"><i class="ti ti-chart-bar" aria-hidden="true"></i>支出分类</div>
    <div id="chart-bars"><div class="empty" style="padding:.5rem 0">暂无支出记录</div></div>
  </div>
</div>

<!-- ===== PAGE: 预算 ===== -->
<div id="page-budget" class="page">
  <div class="card">
    <div class="card-title"><i class="ti ti-plus" aria-hidden="true"></i>设置分类预算</div>
    <div class="form-row">
      <select id="b-cat">
        <option>餐饮</option><option>购物</option><option>交通</option>
        <option>住房</option><option>娱乐</option><option>医疗</option>
        <option>教育</option><option>其他支出</option>
      </select>
      <input type="number" id="b-amount" placeholder="每月限额（元）" min="0"/>
    </div>
    <button class="btn-primary" onclick="addBudget()">设置预算</button>
  </div>

  <div id="budget-list"></div>
  <div id="budget-empty" class="empty" style="display:none"><i class="ti ti-chart-pie"></i>还没有设置预算<br>设置后可追踪每类支出</div>
</div>

<!-- ===== PAGE: 省钱 ===== -->
<div id="page-savings" class="page">
  <div class="card" style="background:var(--income-bg);border-color:var(--income)">
    <div style="font-size:13px;color:var(--income);font-weight:500;margin-bottom:6px">本月已节省（打勾技巧累计）</div>
    <div style="font-size:26px;font-weight:700;color:var(--income)" id="saved-total">¥0</div>
  </div>

  <div class="card">
    <div class="card-title"><i class="ti ti-bulb" aria-hidden="true"></i>添加我的省钱妙招</div>
    <div class="form-row">
      <input type="text" id="tip-name" placeholder="省钱方法（如：自带午餐）"/>
      <input type="number" id="tip-save" placeholder="每月可省（元）" min="0"/>
    </div>
    <input type="text" id="tip-sub" placeholder="说明（可选，如：比外卖省¥500）" style="margin-bottom:10px"/>
    <button class="btn-primary" onclick="addTip()">添加</button>
  </div>

  <div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:10px">打勾代表本月已执行 ✓</div>
  <div id="tips-list"></div>
</div>

<!-- ===== PAGE: 心愿清单 ===== -->
<div id="page-wishlist" class="page">
  <div class="card" style="background:var(--purple-bg);border-color:var(--purple)">
    <div style="font-size:13px;color:var(--purple);font-weight:500;margin-bottom:6px">心愿总金额</div>
    <div style="font-size:26px;font-weight:700;color:var(--purple)" id="wish-total">¥0</div>
    <div style="font-size:12px;color:var(--purple);margin-top:4px;opacity:.8" id="wish-sub">共 0 件，已存 ¥0</div>
  </div>

  <div class="card">
    <div class="card-title"><i class="ti ti-gift" aria-hidden="true"></i>添加心愿</div>
    <div class="form-row">
      <input type="text" id="w-name" placeholder="物品名称（如：相机）"/>
      <input type="number" id="w-price" placeholder="目标价格（元）" min="0"/>
    </div>
    <div class="form-row">
      <select id="w-priority">
        <option value="high">优先级：高</option>
        <option value="mid" selected>优先级：中</option>
        <option value="low">优先级：低</option>
      </select>
      <input type="text" id="w-link" placeholder="购买链接（可选）"/>
    </div>
    <button class="btn-primary" onclick="addWish()">加入心愿清单</button>
  </div>

  <div id="wishlist-list"></div>
</div>

</div><!-- /container -->

<!-- SAVE MODAL (for wishlist) -->
<div class="modal-overlay" id="save-modal">
  <div class="modal">
    <h3>为心愿存钱 💜</h3>
    <input type="hidden" id="save-wish-id"/>
    <div class="modal-row">
      <label>存入金额（元）</label>
      <input type="number" id="save-amount" placeholder="本次存入多少？" min="0"/>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="doSave()">确认存入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- DATA ----
const INCOME_CATS=['工资','奖金','理财','兼职','其他收入'];
const EXPENSE_CATS=['餐饮','购物','交通','住房','娱乐','医疗','教育','其他支出'];
const CAT_COLORS={'餐饮':'#1D9E75','购物':'#D85A30','交通':'#378ADD','住房':'#BA7517','娱乐':'#7F77DD','医疗':'#D4537E','教育':'#639922','其他支出':'#888780'};

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let records=load('fr_records',[]);
let budgets=load('fr_budgets',{});
let tips=load('fr_tips',[]);
let wishes=load('fr_wishes',[]);
let recId=records.length?Math.max(...records.map(r=>r.id))+1:1;
let tipId=tips.length?Math.max(...tips.map(t=>t.id))+1:1;
let wishId=wishes.length?Math.max(...wishes.map(w=>w.id))+1:1;
let curType='income';
let curFilter='all';

// ---- NAV ----
function goPage(name,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='ledger')renderLedger();
  if(name==='budget')renderBudget();
  if(name==='savings')renderSavings();
  if(name==='wishlist')renderWishlist();
}

// ---- TOAST ----
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ---- FORMAT ----
function fmt(n){return'¥'+Math.round(n).toLocaleString('zh-CN');}

// ---- LEDGER ----
function setType(t){
  curType=t;
  document.getElementById('btn-income').classList.toggle('active',t==='income');
  document.getElementById('btn-expense').classList.toggle('active',t==='expense');
  const sel=document.getElementById('inp-cat');
  const cats=t==='income'?INCOME_CATS:EXPENSE_CATS;
  sel.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
}
function setFilter(f,el){
  curFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderLedger();
}
function addRecord(){
  const name=document.getElementById('inp-name').value.trim();
  const amount=parseFloat(document.getElementById('inp-amount').value);
  const cat=document.getElementById('inp-cat').value;
  const date=document.getElementById('inp-date').value||new Date().toISOString().slice(0,10);
  if(!name){toast('请填写备注');return;}
  if(!amount||amount<=0){toast('请填写有效金额');return;}
  records.unshift({id:recId++,type:curType,name,amount,cat,date});
  save('fr_records',records);
  document.getElementById('inp-name').value='';
  document.getElementById('inp-amount').value='';
  toast('已添加'+(curType==='income'?'收入':'支出')+'记录');
  renderLedger();
}
function deleteRecord(id){
  if(!confirm('确定删除？'))return;
  records=records.filter(r=>r.id!==id);
  save('fr_records',records);
  renderLedger();
}
function renderLedger(){
  const ti=records.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const te=records.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
  const bal=ti-te;
  document.getElementById('m-income').textContent=fmt(ti);
  document.getElementById('m-expense').textContent=fmt(te);
  const bEl=document.getElementById('m-balance');
  bEl.textContent=fmt(bal);
  bEl.style.color=bal>=0?'var(--income)':'var(--expense)';

  const filtered=curFilter==='all'?records:records.filter(r=>r.type===curFilter);
  const list=document.getElementById('records-list');
  list.innerHTML=filtered.length?filtered.map(r=>`
    <div class="record">
      <div class="record-dot ${r.type==='income'?'dot-income':'dot-expense'}"></div>
      <div class="record-info">
        <div class="record-name">${escHtml(r.name)}</div>
        <div class="record-meta">${r.cat} · ${r.date}</div>
      </div>
      <div class="record-amount ${r.type==='income'?'amount-income':'amount-expense'}">${r.type==='income'?'+':'−'}${fmt(r.amount)}</div>
      <button class="record-del" onclick="deleteRecord(${r.id})" title="删除"><i class="ti ti-x"></i></button>
    </div>`).join(''):'<div class="empty">暂无记录，添加第一笔吧~</div>';

  const exp=records.filter(r=>r.type==='expense');
  const catMap={};exp.forEach(r=>{catMap[r.cat]=(catMap[r.cat]||0)+r.amount;});
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const maxV=cats[0]?.[1]||1;
  document.getElementById('chart-bars').innerHTML=cats.length?cats.map(([cat,amt])=>`
    <div class="bar-row">
      <div class="bar-label">${cat}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt/maxV*100)}%;background:${CAT_COLORS[cat]||'#888'}"></div></div>
      <div class="bar-amount">${fmt(amt)}</div>
    </div>`).join(''):'<div class="empty" style="padding:.5rem 0">暂无支出记录</div>';
}

// ---- BUDGET ----
function addBudget(){
  const cat=document.getElementById('b-cat').value;
  const amt=parseFloat(document.getElementById('b-amount').value);
  if(!amt||amt<=0){toast('请填写有效金额');return;}
  budgets[cat]=amt;
  save('fr_budgets',budgets);
  document.getElementById('b-amount').value='';
  toast(`已设置【${cat}】预算 ${fmt(amt)}/月`);
  renderBudget();
}
function deleteBudget(cat){
  delete budgets[cat];
  save('fr_budgets',budgets);
  renderBudget();
}
function renderBudget(){
  const cats=Object.keys(budgets);
  const el=document.getElementById('budget-list');
  const emp=document.getElementById('budget-empty');
  if(!cats.length){el.innerHTML='';emp.style.display='';return;}
  emp.style.display='none';

  const spent={};
  records.filter(r=>r.type==='expense').forEach(r=>{spent[r.cat]=(spent[r.cat]||0)+r.amount;});

  el.innerHTML=cats.map(cat=>{
    const limit=budgets[cat];
    const used=spent[cat]||0;
    const pct=Math.min(100,Math.round(used/limit*100));
    const over=used>limit;
    const color=over?'var(--expense)':pct>75?'var(--amber)':'var(--income)';
    return`<div class="budget-item">
      <div class="budget-header">
        <div class="budget-cat">${cat}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="budget-amounts">${fmt(used)} / ${fmt(limit)}</div>
          <button class="btn-sm danger" onclick="deleteBudget('${cat}')">删除</button>
        </div>
      </div>
      <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="budget-status" style="color:${color}">${over?`⚠️ 已超支 ${fmt(used-limit)}`:`剩余 ${fmt(limit-used)}，已用 ${pct}%`}</div>
    </div>`;
  }).join('');
}

// ---- SAVINGS TIPS ----
const DEFAULT_TIPS=[
  {id:-1,name:'自带午餐',sub:'每天比外卖省约¥20',saving:400,done:false},
  {id:-2,name:'使用优惠券/满减',sub:'购物前先查折扣码',saving:200,done:false},
  {id:-3,name:'骑车/步行代替打车',sub:'短途出行省交通费',saving:150,done:false},
  {id:-4,name:'取消不用的订阅',sub:'检查视频、音乐等会员',saving:80,done:false},
  {id:-5,name:'每月记一次账',sub:'了解钱花在哪里',saving:0,done:false},
];
function addTip(){
  const name=document.getElementById('tip-name').value.trim();
  const saving=parseFloat(document.getElementById('tip-save').value)||0;
  const sub=document.getElementById('tip-sub').value.trim();
  if(!name){toast('请填写省钱方法');return;}
  tips.push({id:tipId++,name,sub,saving,done:false});
  save('fr_tips',tips);
  document.getElementById('tip-name').value='';
  document.getElementById('tip-save').value='';
  document.getElementById('tip-sub').value='';
  toast('已添加省钱妙招');
  renderSavings();
}
function toggleTip(id){
  const existing=tips.find(item=>item.id===id);
  if(existing){
    existing.done=!existing.done;
    save('fr_tips',tips);
  } else {
    const dt=DEFAULT_TIPS.find(item=>item.id===id);
    if(dt) tips.push({...dt,done:true});
    save('fr_tips',tips);
  }
  renderSavings();
}
function deleteTip(id){
  tips=tips.filter(t=>t.id!==id);
  save('fr_tips',tips);
  renderSavings();
}
function renderSavings(){
  const allTips=[...DEFAULT_TIPS.filter(dt=>!tips.find(t=>t.id===dt.id)),...tips].sort((a,b)=>b.saving-a.saving);
  const savedTotal=allTips.filter(t=>t.done).reduce((s,t)=>s+t.saving,0);
  document.getElementById('saved-total').textContent=fmt(savedTotal)+' /月';
  document.getElementById('tips-list').innerHTML=allTips.length?allTips.map(t=>`
    <div class="tip-item ${t.done?'done':''}" onclick="toggleTip(${t.id})">
      <div class="tip-check">${t.done?'<i class="ti ti-check" style="font-size:12px"></i>':''}</div>
      <div class="tip-body">
        <div class="tip-text">${escHtml(t.name)}</div>
        ${t.sub?`<div class="tip-sub">${escHtml(t.sub)}</div>`:''}
        ${t.saving>0?`<div class="tip-save">每月可省 ${fmt(t.saving)}</div>`:''}
      </div>
      ${t.id>0?`<button class="btn-sm" onclick="event.stopPropagation();deleteTip(${t.id})">删除</button>`:''}
    </div>`).join(''):'<div class="empty">暂无省钱技巧</div>';
}

// ---- WISHLIST ----
function addWish(){
  const name=document.getElementById('w-name').value.trim();
  const price=parseFloat(document.getElementById('w-price').value);
  const priority=document.getElementById('w-priority').value;
  const link=document.getElementById('w-link').value.trim();
  if(!name){toast('请填写物品名称');return;}
  if(!price||price<=0){toast('请填写目标价格');return;}
  wishes.push({id:wishId++,name,price,priority,link,saved:0,done:false});
  save('fr_wishes',wishes);
  document.getElementById('w-name').value='';
  document.getElementById('w-price').value='';
  document.getElementById('w-link').value='';
  toast(`【${name}】已加入心愿清单`);
  renderWishlist();
}
function openSaveModal(id){
  document.getElementById('save-wish-id').value=id;
  document.getElementById('save-amount').value='';
  document.getElementById('save-modal').classList.add('open');
}
function closeModal(){document.getElementById('save-modal').classList.remove('open');}
function doSave(){
  const id=parseInt(document.getElementById('save-wish-id').value);
  const amt=parseFloat(document.getElementById('save-amount').value);
  if(!amt||amt<=0){toast('请填写有效金额');return;}
  const w=wishes.find(w=>w.id===id);
  if(!w)return;
  w.saved=Math.min(w.price,w.saved+amt);
  if(w.saved>=w.price)w.done=true;
  save('fr_wishes',wishes);
  closeModal();
  toast(w.done?`🎉 【${w.name}】存够了！恭喜！`:`已为【${w.name}】存入 ${fmt(amt)}`);
  renderWishlist();
}
function deleteWish(id){
  if(!confirm('确定移除这个心愿？'))return;
  wishes=wishes.filter(w=>w.id!==id);
  save('fr_wishes',wishes);
  renderWishlist();
}
const PRIORITY_MAP={high:{label:'高优先',cls:'badge-amber'},mid:{label:'中优先',cls:'badge-purple'},low:{label:'低优先',cls:'badge-green'}};
function renderWishlist(){
  const total=wishes.reduce((s,w)=>s+w.price,0);
  const totalSaved=wishes.reduce((s,w)=>s+w.saved,0);
  document.getElementById('wish-total').textContent=fmt(total);
  document.getElementById('wish-sub').textContent=`共 ${wishes.length} 件，已存 ${fmt(totalSaved)}`;

  const sorted=[...wishes].sort((a,b)=>{
    const po={high:0,mid:1,low:2};
    if(a.done!==b.done)return a.done?1:-1;
    return po[a.priority]-po[b.priority];
  });

  document.getElementById('wishlist-list').innerHTML=sorted.length?sorted.map(w=>{
    const pct=Math.round(w.saved/w.price*100);
    const pr=PRIORITY_MAP[w.priority]||PRIORITY_MAP.mid;
    return`<div class="wish-item" style="${w.done?'opacity:.6':''}">
      <div class="wish-header">
        <div class="wish-info">
          <div class="wish-name">${w.done?'✅ ':''} ${escHtml(w.name)}</div>
          <div class="wish-meta">已存 ${fmt(w.saved)} · 还差 ${fmt(Math.max(0,w.price-w.saved))}</div>
        </div>
        <div class="wish-price">${fmt(w.price)}</div>
      </div>
      <div class="wish-progress-wrap">
        <div class="wish-progress-track"><div class="wish-progress-fill" style="width:${pct}%;${w.done?'background:var(--income)':''}"></div></div>
        <div class="wish-progress-label"><span>${pct}% 完成</span><span><span class="badge ${pr.cls}">${pr.label}</span></span></div>
      </div>
      <div class="wish-actions">
        ${!w.done?`<button class="btn-sm" onclick="openSaveModal(${w.id})"><i class="ti ti-coin" style="font-size:13px;vertical-align:-1px"></i> 存钱</button>`:''}
        ${w.link?`<button class="btn-sm" onclick="openLink('${escHtml(w.link)}')"><i class="ti ti-external-link" style="font-size:13px;vertical-align:-1px"></i> 去看看</button>`:''}
        <button class="btn-sm danger" onclick="deleteWish(${w.id})">移除</button>
      </div>
    </div>`;
  }).join(''):'<div class="empty"><i class="ti ti-heart"></i>心愿清单空空的<br>把想买的东西加进来吧</div>';
}

function openLink(url){window.open(url,'_blank');}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ---- INIT ----
document.getElementById('inp-date').value=new Date().toISOString().slice(0,10);
setType('income');
renderLedger();

document.getElementById('inp-amount').addEventListener('keydown',e=>{if(e.key==='Enter')addRecord();});
document.getElementById('save-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
</script>
